<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>joshua basshub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="#home">home</a>
        <a href="#songs">songs</a>
        <a href="#era">era</a>
        <a href="#timeline">timeline</a>
    </nav>

    <header class="hero" id="home">
        <h1>joshua bassett hub</h1>
        <p>my little joshua internet corner</p>
        <button id="eraButton">enter the joshua era</button>
    </header>

    <section class="card" id="songs">
        <h2>currently obsessed with</h2>

        <input type="text" id="searchInput" placeholder="search for a song...">
        <select id="albumFilter">
            <option value="all">all albums</option>
        </select>

        <div class="songs" id="songsContainer">
            
        </div>
    </section>

    <section class="card" id="era">
        <h2>favourite era</h2>
        <p>the golden years</p>
    </section>

    <section class="card" id="timeline">
        <h2>joshua's journey</h2>

        <div class="timeline">
            <div class="event">
                <h3>2019</h3>
                <p>hsmtmts start</p>
            </div>
            <div class="event">
                <h3>2021</h3>
                <p>jbep</p>
            </div>
            <div class="event">
                <h3>2021</h3>
                <p>cssmf</p>
            </div>
            <div class="event">
                <h3>2022</h3>
                <p>ssiahr</p>
            </div>
            <div class="event">
                <h3>2024</h3>
                <p>tgy</p>
            </div>
            <div class="event">
                <h3>2026</h3>
                <p>rookie</p>
            </div>
            <div class="event">
                <h3>2026</h3>
                <p>easier</p>
            </div>
        </div>
    </section>

    <script src="data/songs.js"></script>
    <script src="script.js"></script>
</body>
</html>
